<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#01abed" />

  <title>Center for Global Health &amp; Pandemic Intelligence</title>
  <meta name="description"
    content="CGP works with countries, communities and partners to strengthen epidemic intelligence — detecting outbreaks faster, sharing what we learn, and acting on it." />
  <meta name="author" content="Center for Global Health &amp; Pandemic Intelligence" />

  <!--
    Canonical and social defaults. scripts/generate-sitemap.mjs rewrites the
    origin in these four tags at build time from VITE_SITE_URL, so they can
    never point at a preview host. Seo.jsx then rewrites them again per route
    once React hydrates. Crawlers read exactly what is in this file.
  -->
  <link rel="canonical" href="https://pandemicintelcenter.org/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Center for Global Health &amp; Pandemic Intelligence" />
  <meta property="og:title" content="Center for Global Health &amp; Pandemic Intelligence" />
  <meta property="og:description"
    content="CGP works with countries, communities and partners to strengthen epidemic intelligence — detecting outbreaks faster, sharing what we learn, and acting on it." />
  <meta property="og:url" content="https://pandemicintelcenter.org/" />
  <meta property="og:image" content="https://pandemicintelcenter.org/og/cgp-og-default.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Center for Global Health &amp; Pandemic Intelligence (CGP)" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Center for Global Health &amp; Pandemic Intelligence" />
  <meta name="twitter:description"
    content="CGP works with countries, communities and partners to strengthen epidemic intelligence — detecting outbreaks faster, sharing what we learn, and acting on it." />
  <meta name="twitter:image" content="https://pandemicintelcenter.org/og/cgp-og-default.png" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/Assets/icon-192.png" />
  <link rel="apple-touch-icon" href="/Assets/icon-192.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Web fonts, self-hosted (src/fonts.css). Inter is the body face and is
       on the critical path for the first painted text, so it is preloaded to
       start the fetch alongside the CSS bundle instead of after it. Poppins is
       the display face for headings and buttons; it is preloaded for the same
       reason. crossorigin is required — fonts are always fetched in CORS
       mode, and a preload without it is fetched twice. -->
  <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/poppins-latin-600.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Bootstrap Icons: the CDN file is cached across page loads, so it costs
       one connection but nothing after the first. dns-prefetch removes the DNS
       round trip from the critical path. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    /* Critical shell styles: prevents an unstyled flash while the CSS bundle
       downloads, and gives keyboard users a working skip link immediately.

       The skip link is styled here AND in styles/site.css. This block uses the
       same class so the two agree; it is off-screen until focused, then pinned
       to the top-left above everything else. */
    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #000000;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      z-index: 1200;
      padding: 0.75rem 1.25rem;
      background: #000000;
      color: #ffffff;
      font-weight: 600;
    }

    .skip-link:focus {
      left: 0.5rem;
      top: 0.5rem;
    }
  </style>
</head>

<body>
  <!--
    The site's only skip link, and deliberately outside #root so it survives
    hydration untouched. Layout.jsx does not render a second one: two identical
    "Skip to main content" links put the control in the tab order twice and
    announce the same thing twice.
  -->
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="root"></div>
  <noscript>
    <div style="max-width: 44rem; margin: 4rem auto; padding: 0 1.5rem; line-height: 1.6;">
      <h1>Center for Global Health &amp; Pandemic Intelligence</h1>
      <p>
        This site needs JavaScript enabled to display its project record, insights and
        research pages. If you cannot enable JavaScript, please email
        <a href="mailto:info@pandemicintelcenter.org">info@pandemicintelcenter.org</a>
        and we will send you the information you are looking for.
      </p>
    </div>
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
